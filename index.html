<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie显示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }
        
        .cookie-display {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            word-break: break-all;
            white-space: pre-wrap;
            min-height: 100px;
            border: 1px solid #e0e0e0;
            font-size: 0.9rem;
        }
        
        .no-cookie {
            color: #7f8c8d;
            font-style: italic;
        }
        
        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        
        .info {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>当前页面Cookie信息</h1>
        
        <div id="cookieDisplay" class="cookie-display">
            <!-- Cookie内容将在这里显示 -->
        </div>
        
        <button class="refresh-btn" onclick="displayCookies()">刷新Cookie信息</button>
        
        <p class="info">页面加载时自动显示当前域名下的所有Cookie</p>
    </div>
    
    <script>
        function displayCookies() {
            const cookieDisplay = document.getElementById('cookieDisplay');
            const cookies = document.cookie;
            
            if (!cookies) {
                cookieDisplay.textContent = "当前没有Cookie信息";
                cookieDisplay.classList.add('no-cookie');
            } else {
                cookieDisplay.textContent = cookies;
                cookieDisplay.classList.remove('no-cookie');
            }
        }
        
        // 页面加载时显示Cookie
        window.onload = displayCookies;
    </script>
</body>
</html>
