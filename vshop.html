<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vivo Store EXP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主卡片容器 - 充分利用宽度 */
        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* 头部区域 */
        .header {
            background: #1a2c3e;
            color: white;
            padding: 1.8rem 2rem;
            text-align: center;
        }

        .header h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.8;
            font-size: 1rem;
        }

        /* 按钮工具栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            padding: 2rem 2rem 1.2rem 2rem;
            background: #ffffffcc;
            border-bottom: 1px solid #e2e8f0;
            justify-content: center;
        }

        .btn {
            flex: 1;
            min-width: 220px;
            padding: 1rem 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            background: #f1f5f9;
            color: #1e293b;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: #0f3b5f;
            color: white;
            box-shadow: 0 8px 18px rgba(15, 59, 95, 0.25);
        }

        .btn-primary:hover {
            background: #1e4a76;
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(15, 59, 95, 0.3);
        }

        .btn-secondary {
            background: #2c6e49;
            color: white;
            box-shadow: 0 8px 18px rgba(44, 110, 73, 0.2);
        }

        .btn-secondary:hover {
            background: #3b8a5c;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* 结果显示区 - 尽可能大 */
        .result-area {
            padding: 2rem 2rem 2.5rem 2rem;
            background: #fefefe;
        }

        .result-card {
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 32px;
            padding: 1.5rem;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 10px 25px -5px rgba(0,0,0,0.2);
            min-height: 380px;
            max-height: 65vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result-card h3 {
            font-family: system-ui;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #94a3b8;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
            letter-spacing: -0.2px;
        }

        pre {
            background: #0a0f1a;
            padding: 1rem;
            border-radius: 20px;
            overflow-x: auto;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .status-badge {
            display: inline-block;
            background: #334155;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .footer {
            background: #eef2f6;
            text-align: center;
            font-size: 0.75rem;
            padding: 1rem;
            color: #475569;
            border-top: 1px solid #cbd5e1;
        }

        @media (max-width: 680px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; }
            .result-card { font-size: 0.8rem; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <button class="btn btn-secondary" id="getLocationBtn">📍 获取位置信息</button>
    </div>
    <div class="result-area">
        <div class="result-card" id="resultContainer">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 10px;">
                <h3 style="margin-bottom: 0;">📋 信息输出</h3>
                <span class="status-badge" id="liveStatus">等待操作</span>
            </div>
            <div id="displayContent">
                <p style="color: #94a3b8; text-align: center; padding: 2rem;">点击上方按钮，结果将实时显示在此区域。</p>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // DOM 元素
        const locationBtn = document.getElementById('getLocationBtn');
        const displayDiv = document.getElementById('displayContent');
        const statusSpan = document.getElementById('liveStatus');

		window.callbackLocation = function(result) {
            statusSpan.textContent = "设备位置" + JSON.stringify(result);
            statusSpan.style.background = '#2c6e49';
        }

        function onGetLocation() {
            window.window.WebViewJavascriptBridge.callHandler('getLocation', '{}', window.callbackLocation)
        }

        // 绑定事件
        locationBtn.addEventListener('click', onGetLocation);
        
        // 可选: 首次加载自动显示一个默认占位，但不请求权限
        renderToScreen('✨ 就绪状态', { info: '点击「获取设备指纹」或「获取位置信息」，数据会实时展现在这里，保留最近记录。' }, false);
    })();
</script>
</body>
</html>
